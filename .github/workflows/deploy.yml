# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in your repository:
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
#
# After that, every `git push` updates the live site automatically.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run the deployment by hand from the Actions tab
  workflow_dispatch:

# Permissions the deploy step needs
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
